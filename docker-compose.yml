# Имя проекта задано явно: Compose выводит его из имени папки,
# а кириллица после санитизации схлопывается в пустую строку.
name: kvest

services:
  db:
    image: postgres:17-alpine
    container_name: kvest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kvest
      POSTGRES_PASSWORD: kvest
      POSTGRES_DB: kvest
    ports:
      - "5433:5432"
    volumes:
      - kvest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kvest-pgdata:
